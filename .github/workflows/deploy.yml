name: Deploy

on:
  workflow_run:
    workflows: ["Backend CI"]
    types:
      - completed
    branches:
      - main

permissions:
  contents: read
  packages: write

jobs:
  deploy:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build AuthService image
        run: |
          docker build \
            -t ghcr.io/${{ github.repository_owner }}/personalportalen/authservice:${{ github.sha }} \
            ./AuthService

      - name: Push AuthService image
        run: |
          docker push \
            ghcr.io/${{ github.repository_owner }}/personalportalen/authservice:${{ github.sha }}
