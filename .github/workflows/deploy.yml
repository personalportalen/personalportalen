name: Deploy

on:
  workflow_run:
    workflows: ["Backend CI"]
    types:
      - completed
    branches:
      - main

permissions:
  contents: read
  packages: write

jobs:
  deploy:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build AuthService image
        run: |
          docker build \
            -t ghcr.io/${{ github.repository_owner }}/personalportalen/authservice:${{ github.sha }} \
            ./AuthService

      - name: Build ProfileService image
        run: |
          docker build \
            -t ghcr.io/${{ github.repository_owner }}/personalportalen/profileservice:${{ github.sha }} \
            ./ProfileService

      - name: Build BookingService image
        run: |
          docker build \
            -t ghcr.io/${{ github.repository_owner }}/personalportalen/bookingservice:${{ github.sha }} \
            ./BookingService

      - name: Build WorkshiftService image
        run: |
          docker build \
            -t ghcr.io/${{ github.repository_owner }}/personalportalen/workshiftservice:${{ github.sha }} \
            ./WorkshiftService

      - name: Build Gateway image
        run: |
          docker build \
            -t ghcr.io/${{ github.repository_owner }}/personalportalen/gateway:${{ github.sha }} \
            ./YarpGateway

      - name: Push AuthService image
        run: |
          docker push \
            ghcr.io/${{ github.repository_owner }}/personalportalen/authservice:${{ github.sha }}

      - name: Push ProfileService image
        run: |
          docker push \
            ghcr.io/${{ github.repository_owner }}/personalportalen/profileservice:${{ github.sha }}

      - name: Push BookingService image
        run: |
          docker push \
            ghcr.io/${{ github.repository_owner }}/personalportalen/bookingservice:${{ github.sha }}

      - name: Push WorkshiftService image
        run: |
          docker push \
            ghcr.io/${{ github.repository_owner }}/personalportalen/workshiftservice:${{ github.sha }}

      - name: Push Gateway image
        run: |
          docker push \
            ghcr.io/${{ github.repository_owner }}/personalportalen/gateway:${{ github.sha }}

      - name: Deploy to VM
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.VM_SSH_KEY }}
          script: |
            cd ~/apps/staffsystem

            echo "${{ secrets.GHCR_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

            export GITHUB_REPOSITORY_OWNER="${{ github.repository_owner }}"
            export IMAGE_TAG="${{ github.sha }}"

            sudo docker-compose -f docker-compose.yml -f docker-compose.prod.yml pull
            sudo docker-compose -f docker-compose.yml -f docker-compose.prod.yml up -d
